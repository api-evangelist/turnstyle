name: Turnstyle
description: Turnstyle (Turnstyle Analytics) was a WiFi-marketing and customer-analytics platform for
  brick-and-mortar businesses, capturing guest WiFi logins to build customer profiles, segments, and
  automated re-marketing campaigns. It was a 500 Global portfolio company and was acquired by Yelp,
  becoming Yelp WiFi. As of this enrichment pass the product no longer operates independently - its
  domain getturnstyle.com now permanently redirects through app.yelpwifi.com to business.yelp.com (Yelp
  for Business). No standalone Turnstyle developer portal, API, documentation, or SDKs are published;
  there is no independent API surface to enrich.
